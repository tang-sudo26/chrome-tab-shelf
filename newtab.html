<!doctype html>
<html lang="zh-CN" data-layout="launcher" data-theme-mode="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>新标签页</title>
  <link rel="icon" type="image/svg+xml" sizes="any" href="icons/new-tab.svg">
  <link rel="stylesheet" href="newtab.css">
  <script src="newtab.js" defer></script>
</head>
<body>
  <div class="shell">
    <header class="masthead">
      <h1 id="page-title" class="wordmark">
        <img class="brand-mark" src="icons/tabshelf.svg" width="27" height="27" alt="">
        TabShelf
      </h1>
      <form id="web-search-form" class="web-search" role="search" aria-label="网页搜索">
        <label for="web-search-input" class="web-search-label">Chrome 网页搜索</label>
        <div class="web-search-row">
          <svg class="chrome-mark" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24">
            <path fill="#ea4335" d="M22.39 6H12a6 6 0 0 0-5.2 9L1.6 6A12 12 0 0 1 22.39 6Z"/>
            <path fill="#fbbc05" d="M12 24l5.2-9A6 6 0 0 0 12 6h10.39A12 12 0 0 1 12 24Z"/>
            <path fill="#34a853" d="M1.61 6l5.2 9a6 6 0 0 0 10.39 0L12 24A12 12 0 0 1 1.61 6Z"/>
            <circle cx="12" cy="12" r="5.25" fill="#4285f4" stroke="#fff" stroke-width="1"/>
          </svg>
          <input id="web-search-input" type="search" placeholder="搜索网页" autocomplete="off" spellcheck="false" enterkeyhint="search">
          <button id="web-search-submit" class="button primary" type="submit" aria-label="搜索网页">
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15m-6-6 6 6-6 6"/></svg>
          </button>
        </div>
        <p id="web-search-error" class="web-search-error" role="alert"></p>
      </form>
      <div class="brand-tools">
        <label class="sr-only" for="theme-mode">外观</label>
        <select id="theme-mode" class="select" disabled>
          <option value="light" selected>浅色</option>
          <option value="dark">深色</option>
          <option value="chrome">跟随 Chrome</option>
        </select>
        <details class="layout-picker">
          <summary class="icon-button" aria-label="切换布局" title="切换布局">
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18m-12 0v11"/></svg>
          </summary>
          <div class="layout-picker-panel">
            <label for="layout-mode">布局</label>
            <select id="layout-mode" class="select" disabled>
              <option value="launcher" selected>清爽启动页</option>
              <option value="workbench">紧凑工作台</option>
            </select>
          </div>
        </details>
      </div>
    </header>

    <main id="workspace" class="workspace">
      <div class="toolbar">
        <nav class="tabs" role="tablist" aria-label="工作区">
          <button id="tab-shelf" class="tab" type="button" role="tab" aria-selected="true" aria-controls="panel-shelf" data-view="shelf">
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3h4v18H4zM8 3h4v18H8zM13 5l4-1 5 16-4 1z"/></svg>
            收藏架
          </button>
          <button id="tab-unshelved" class="tab" type="button" role="tab" aria-selected="false" aria-controls="panel-unshelved" data-view="unshelved" tabindex="-1">
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 9v11"/></svg>
            未上架 <span id="unshelved-count" class="count">—</span>
          </button>
          <button id="tab-snapshots" class="tab" type="button" role="tab" aria-selected="false" aria-controls="panel-snapshots" data-view="snapshots" tabindex="-1">
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h4l2-3h4l2 3h4a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13" r="3.5"/></svg>
            快照
          </button>
        </nav>
        <div class="toolbar-actions">
          <button id="toggle-categories" class="button secondary" type="button" aria-controls="category-bar" aria-expanded="false" data-action="categories-toggle" hidden>分组</button>
          <button id="take-snapshot" class="button primary" type="button" data-action="snapshot-preview" data-needs-catalog>
            <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h4l2-3h4l2 3h4a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13" r="3.5"/></svg>
            拍快照
          </button>
        </div>
        <nav id="category-bar" class="category-bar" aria-labelledby="category-heading" hidden>
          <h2 id="category-heading">分组</h2>
          <ul id="category-list" class="category-list"></ul>
          <details class="category-disclosure" name="shelf-disclosures">
            <summary class="button secondary small">管理分类</summary>
            <div class="category-actions">
              <button id="new-category" class="button secondary small" type="button" data-action="category-new">
                <svg aria-hidden="true" width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M10 4v12M4 10h12"/></svg>
                新建分类
              </button>
              <button id="delete-category" class="button subtle danger-text small" type="button" data-action="category-delete" hidden>删除分类</button>
              <button id="clear-shelf" class="button subtle danger-text small" type="button" data-action="shelf-clear">清空架子</button>
            </div>
          </details>
        </nav>
      </div>

      <div id="load-error" class="notice error" hidden>
        <span id="load-error-text" role="alert"></span>
        <button id="retry-catalog" class="button secondary small" type="button" data-action="refresh">重新加载</button>
      </div>
      <div id="loading" class="notice" role="status">正在整理架子…</div>

      <section id="panel-shelf" class="panel shelf-panel" role="tabpanel" aria-labelledby="tab-shelf" hidden>
        <div class="collection">
          <div class="panel-heading">
            <div class="heading-copy">
              <h2 id="shelf-heading" tabindex="-1">全部收藏</h2>
              <p id="shelf-summary" class="muted"></p>
            </div>
            <div class="shelf-heading-actions">
              <button id="toggle-shelf-search" class="button secondary small" type="button" aria-expanded="false" aria-controls="shelf-search-box" data-action="search-toggle">
                <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 5 5"/></svg>
                搜收藏
              </button>
              <button id="toggle-selection" class="button secondary small" type="button" aria-pressed="false" aria-controls="shelf-selection" data-action="selection-toggle">
                <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m3 6 2 2 3-4m-5 8 2 2 3-4m-5 8 2 2 3-4m4-10h9m-9 6h9m-9 6h9"/></svg>
                <span>多选</span>
              </button>
            </div>
          </div>
          <div id="shelf-search-box" class="search-box" role="search" aria-label="搜收藏" hidden>
            <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 5 5"/></svg>
            <input id="shelf-search" type="search" placeholder="搜索收藏的标题或网址" aria-label="搜索所有分类中的标题或网址" autocomplete="off" spellcheck="false">
          </div>
          <div id="shelf-selection" class="selection-bar" hidden>
            <label class="check-label"><input id="select-visible" type="checkbox">全选当前列表</label>
            <span id="selection-count" class="muted" aria-live="polite"></span>
            <div id="selection-actions" class="selection-actions" hidden>
              <button id="open-selected" class="button primary small" type="button" data-action="open-selected">打开所选</button>
              <button id="clear-selection" class="button subtle small" type="button" data-action="selection-clear">清除选择</button>
              <button id="delete-selected" class="button danger-outline small" type="button" data-action="links-delete">删除所选</button>
            </div>
          </div>
          <div id="shelf-empty" class="empty" hidden></div>
          <ul id="shelf-list" class="card-grid" aria-label="架子上的链接"></ul>
          <section id="recent-links" class="recent-links" aria-labelledby="recent-heading" hidden>
            <h3 id="recent-heading" class="recent-label">
              <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4v5h5M3.5 9a9 9 0 1 1-.2 5m8.7-7v5l4 2"/></svg>
              最近使用
            </h3>
            <ul id="recent-list" class="recent-list"></ul>
          </section>
        </div>
      </section>

      <section id="panel-unshelved" class="panel single-panel" role="tabpanel" aria-labelledby="tab-unshelved" hidden>
        <div class="panel-heading">
          <div>
            <h2 id="unshelved-heading" tabindex="-1">未上架的标签页</h2>
            <p id="unshelved-summary" class="muted"></p>
          </div>
          <div class="shelf-heading-actions">
            <button id="toggle-unshelved-selection" class="button secondary small" type="button" aria-pressed="false" aria-controls="unshelved-selection" data-action="unshelved-selection-toggle">
              <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m3 6 2 2 3-4m-5 8 2 2 3-4m-5 8 2 2 3-4m4-10h9m-9 6h9m-9 6h9"/></svg>
              <span>多选</span>
            </button>
          </div>
        </div>
        <div id="unshelved-selection" class="selection-bar" role="group" aria-label="批量上架操作" hidden>
          <label class="check-label"><input id="unshelved-select-all" type="checkbox">全选当前列表</label>
          <span id="unshelved-selection-count" class="muted" aria-live="polite"></span>
          <div class="selection-actions">
            <select id="unshelved-batch-category" class="select" aria-label="批量上架分类"></select>
            <button id="unshelved-save-selected" class="button primary small" type="button" data-action="unshelved-save-selected" disabled>批量上架</button>
            <button id="unshelved-save-close-selected" class="button secondary small" type="button" data-action="unshelved-save-close-selected" disabled>上架并关闭</button>
          </div>
        </div>
        <div id="unshelved-empty" class="empty" hidden></div>
        <div id="unshelved-groups" class="card-grid"></div>
      </section>

      <section id="panel-snapshots" class="panel single-panel" role="tabpanel" aria-labelledby="tab-snapshots" hidden>
        <div class="panel-heading">
          <div>
            <h2 id="snapshots-heading" tabindex="-1">浏览快照</h2>
            <p id="snapshots-summary" class="muted"></p>
          </div>
        </div>
        <div id="snapshots-empty" class="empty" hidden></div>
        <ul id="snapshots-list" class="card-grid" aria-label="已保存的快照"></ul>
      </section>
    </main>

  </div>

  <div id="feedback" class="feedback" hidden>
    <p id="operation-status" role="status"></p>
    <p id="operation-error" role="alert"></p>
    <button id="dismiss-feedback" class="icon-button" type="button" aria-label="关闭提示" data-action="feedback-dismiss">×</button>
  </div>

  <dialog id="category-dialog" aria-labelledby="category-dialog-title">
    <form id="category-form">
      <div class="dialog-heading">
        <div>
          <p class="eyebrow">整理架子</p>
          <h2 id="category-dialog-title">新建分类</h2>
        </div>
        <button class="icon-button close-button" type="button" aria-label="关闭" data-action="dialog-close">×</button>
      </div>
      <div class="dialog-body">
        <label class="field-label" for="category-name">分类名称</label>
        <input id="category-name" class="text-field" name="categoryName" type="text" placeholder="例如：工作参考" required autocomplete="off">
      </div>
      <p class="dialog-error" role="alert" hidden></p>
      <div class="dialog-footer">
        <button class="button secondary" type="button" data-action="dialog-close">取消</button>
        <button id="create-category" class="button primary" type="submit" data-action="category-create">创建分类</button>
      </div>
    </form>
  </dialog>

  <dialog id="confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-description">
    <div class="dialog-heading">
      <h2 id="confirm-title"></h2>
      <button class="icon-button close-button" type="button" aria-label="关闭" data-action="dialog-close">×</button>
    </div>
    <div class="dialog-body">
      <p id="confirm-description"></p>
    </div>
    <p class="dialog-error" role="alert" hidden></p>
    <div class="dialog-footer">
      <button id="cancel-confirm" class="button secondary" type="button" data-action="dialog-close">取消</button>
      <button id="confirm-action" class="button danger" type="button" data-action="confirm-submit"></button>
    </div>
  </dialog>

  <dialog id="snapshot-dialog" class="wide-dialog" aria-labelledby="snapshot-dialog-title" aria-describedby="snapshot-description">
    <div class="dialog-heading">
      <div>
        <p class="eyebrow">记录浏览现场</p>
        <h2 id="snapshot-dialog-title">拍快照</h2>
      </div>
      <button class="icon-button close-button" type="button" aria-label="关闭" data-action="dialog-close">×</button>
    </div>
    <div class="dialog-body snapshot-body">
      <p id="snapshot-description"></p>
      <div class="snapshot-settings">
        <label class="category-field" for="snapshot-category">新链接存入 <select id="snapshot-category" class="select"></select></label>
        <span id="snapshot-close-count" class="count-callout" aria-live="polite"></span>
      </div>
      <div id="snapshot-preview" class="preview-list" aria-label="快照预览"></div>
    </div>
    <p class="dialog-error" role="alert" hidden></p>
    <div class="dialog-footer">
      <button class="button subtle" type="button" data-action="dialog-close">取消</button>
      <button id="snapshot-save" class="button primary" type="button" data-action="snapshot-save">仅保存</button>
      <button id="snapshot-save-close" class="button secondary" type="button" data-action="snapshot-save-close">保存并关闭</button>
    </div>
  </dialog>

  <dialog id="snapshot-detail-dialog" class="wide-dialog" aria-labelledby="snapshot-detail-title">
    <div class="dialog-heading">
      <div>
        <p class="eyebrow">已保存的快照</p>
        <h2 id="snapshot-detail-title"></h2>
        <p id="snapshot-detail-summary" class="muted"></p>
      </div>
      <button class="icon-button close-button" type="button" aria-label="关闭" data-action="dialog-close">×</button>
    </div>
    <div id="snapshot-detail" class="dialog-body preview-list"></div>
    <div class="dialog-footer">
      <p id="snapshot-open-status" class="snapshot-open-status" role="status"></p>
      <p class="dialog-error" role="alert" hidden></p>
      <div class="selection-bar snapshot-detail-selection">
        <label class="check-label"><input id="snapshot-select-all" type="checkbox">全选</label>
        <span id="snapshot-selection-count" class="muted" aria-live="polite"></span>
        <button id="snapshot-open-selected" class="button primary small" type="button" data-action="snapshot-open-selected" disabled>打开所选</button>
      </div>
      <button class="button secondary" type="button" data-action="dialog-close">完成</button>
    </div>
  </dialog>
</body>
</html>
